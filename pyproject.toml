[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
[project]
name = "shipping-equity-research"
version = "0.1.0"
description = "Fleet assets, operating cash flows and market-implied earnings in a modular shipping equity model"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "pandas>=2.3,<3", "matplotlib>=3.10,<4", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "openpyxl>=3.1,<4"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.17,<2", "pandas-stubs>=2.3,<3"]
[project.scripts]
shipping-equity = "shipping_equity.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/shipping_equity"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
[tool.pytest.ini_options]
testpaths = ["tests"]
